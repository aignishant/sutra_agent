[project]
name = "sutra"
version = "0.1.0"
description = "An autonomous support-ticket triage desk, built one day at a time with Google ADK 2.x, MCP, Agent Skills and A2A."
readme = "README.md"
requires-python = "==3.12.*"
# Principle 7: packages arrive on the day they are first used, pinned with ==, and every pin
# gets a dated row in docs/PACKAGES.md. Day 0 adds no runtime dependency at all.
dependencies = [
    "google-adk==2.7.1",
    "google-genai==2.19.0",
    "mcp==1.29.1",
]

[dependency-groups]
dev = [
    "ruff==0.16.4",
    "pytest==9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sutra", "sutra_mcp"]

[tool.uv]
# uv installs by hardlinking from its cache into .venv, which is fast and uses no extra disk.
# A cloud-synced folder (OneDrive, Dropbox, iCloud Drive) refuses hardlinks, and the install dies
# half-done with `os error 396`. Copying costs a few hundred milliseconds and always works.
link-mode = "copy"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["legacy", "days/*/lab"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers"
testpaths = ["tests"]
markers = [
    "live: hits a real API, model or database - skipped by default, never run in CI",
    "slow: takes more than a few seconds",
]
